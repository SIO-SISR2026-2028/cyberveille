name: Réglages des alertes

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  appliquer:
    # Seul le propriétaire du dépôt peut modifier les réglages
    if: startsWith(github.event.issue.title, 'Réglages CyberVeille') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const m = body.match(/```json\s*([\s\S]*?)```/);
            const num = context.payload.issue.number;
            const reply = async (msg) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: num, body: msg });
              await github.rest.issues.update({ ...context.repo, issue_number: num, state: 'closed' });
            };
            if (!m) return reply('Réglages introuvables dans le message.');
            let p; try { p = JSON.parse(m[1]); } catch (e) { return reply('Réglages illisibles : ' + e.message); }
            const pick = (v, list, d) => list.includes(v) ? v : d;
            const email = {
              actif: p.actif !== false,
              frequence: pick(p.frequence, ['instantane', 'horaire', '6h', 'quotidien', 'hebdomadaire'], 'quotidien'),
              heure: /^\d{2}:\d{2}$/.test(p.heure) ? p.heure : '08:00',
              jour_semaine: Math.min(6, Math.max(0, Number(p.jour_semaine) || 1)),
              gravite_minimale: pick(p.gravite_minimale, ['faible', 'moyen', 'eleve', 'critique'], 'moyen'),
              zone: pick(p.zone, ['toutes', 'france'], 'toutes'),
              sources: Array.isArray(p.sources) ? p.sources.map(String).slice(0, 30) : [],
              mots_cles: Array.isArray(p.mots_cles) ? p.mots_cles.map(String).slice(0, 20) : [],
              max_actus: Math.min(50, Math.max(5, Number(p.max_actus) || 20)),
              resume: pick(p.resume, ['aucun', 'court', 'standard', 'detaille'], 'standard'),
            };
            const cfg = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            cfg.email = email;
            fs.writeFileSync('config.json', JSON.stringify(cfg, null, 2) + '\n');
            const { execSync } = require('child_process');
            execSync('git config user.name "cyberveille-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add config.json && (git diff --staged --quiet || git commit -m "Réglages des alertes mis à jour") && git pull --rebase -q && git push -q');
            await reply('✅ Réglages appliqués. Ils seront utilisés dès la prochaine collecte.');
