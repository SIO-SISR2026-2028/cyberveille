name: Veille cyber

on:
  schedule:
    - cron: "*/5 * * * *"    # toutes les 5 min (minimum autorisé par GitHub, qui peut retarder un peu)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
    inputs:
      test_mail:
        description: "Envoyer un e-mail de test"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/*.js", "docs/*.html", "docs/*.css", "config.json", "scripts/**", ".github/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .cache/models
          key: deps-${{ hashFiles('package.json') }}-opusmt-qwen

      - run: npm install --no-audit --no-fund

      - name: Collecte des actus + e-mail
        run: node scripts/collect.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Sauvegarde des données
        run: |
          git config user.name "cyberveille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state.json
          git diff --staged --quiet || git commit -m "Mise à jour des actus" -q
          git pull --rebase -q && git push -q || true

      - name: Version des fichiers (anti-cache)
        run: sed -i -E "s/\?v=[0-9a-z]+/?v=${GITHUB_SHA::7}/g" docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
