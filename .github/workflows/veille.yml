name: Veille cyber

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["docs/**", "config.json", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Collecte des actus + e-mail
        run: node scripts/collect.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Sauvegarde des données
        run: |
          git config user.name "cyberveille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state.json
          git diff --staged --quiet || git commit -m "Mise à jour des actus" -q
          git pull --rebase -q && git push -q || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
